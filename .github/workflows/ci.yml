name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: pyflakes src sample_service tests
      - name: Tests
        run: pytest -q
      - name: Pipeline smoke run (offline)
        run: rga run --offline --auto-approve && test -f output/coverage_map.md
      - name: diff-runner demo (offline)
        run: scripts/diff_demo.sh --offline && test -f examples/diff-demo/workspace/output/diff_report.md
